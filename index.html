
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Prescribe - Medicine Safety for Kids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --medical-teal: #0D9488;
            --soft-sky: #E0F2FE;
            --safety-orange: #F59E0B;
        }
        body {
            font-family: 'Lexend', sans-serif;
            scroll-behavior: smooth;
            font-size: 18px;
        }
        .bg-soft-mesh {
            background-color: var(--soft-sky);
            background-image: 
                radial-gradient(at 0% 0%, #BAE6FD 0, transparent 50%), 
                radial-gradient(at 100% 0%, #99F6E4 0, transparent 50%),
                radial-gradient(at 50% 100%, #FEF3C7 0, transparent 50%);
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .prescribly-wiggle {
            animation: wiggle 2s ease-in-out infinite;
        }
        .prescribly-bounce {
            animation: bounce-slow 3s ease-in-out infinite;
        }
    </style>
